# Database config for the dummy app's test suite.
#
# Default is SQLite (zero-setup, the default matrix leg). The Postgres and
# MySQL matrix legs in .github/workflows/test.yml set DATABASE_URL, which
# Rails reads and OVERRIDES this file with automatically (ActiveRecord merges
# ENV["DATABASE_URL"] over the YAML connection) — so we don't need separate
# adapter blocks here, the one DATABASE_URL drives the whole CI database
# matrix.
test:
  adapter: sqlite3
  # The file name carries the Rails version because the appraisal legs share
  # this directory. A database migrated under one Rails version and reused
  # under another fails with NOT NULL violations that look like product bugs
  # and are not; a file per leg makes the matrix order-independent.
  database: <%= File.expand_path("../db/test-rails-#{Rails::VERSION::STRING.split(%q{.}).first(2).join(%q{-})}.sqlite3", __dir__) %>
  pool: 5
  timeout: 5000
  url: <%= ENV["DATABASE_URL"] %>
